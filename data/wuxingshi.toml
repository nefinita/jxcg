# ============================================================================
# 五行石合成 / 精炼
#
# 来源：游戏内精炼面板（2026-11，参考 JX3BOX 2026-11-08《面向萌新的五行石精炼方法与成本》
#       https://www.jx3box.com/community/6363）与社区配方整理；概率/加工费为面板口径，待实机校准。
#
# 模型：
# - `[[fangan]]` 合成方案（游戏内「一键合成/自动合成」使用的配方集合）；
# - `[[hecheng]]` 单步合成配方：主产物 chanpin + 材料 cailiao + 精力 + 加工费 + 概率结果 jieguo；
#   jieguo.bp 为万分比（9276 = 92.76%），未列出的余量视为失败（材料损失、无产物）。
# - 计算「合成到 6 级」时按期望递归展开：主产物概率 <100% 时按 1/p 放大投入，
#   副产物（2/5/6 级）按行情折价冲抵成本。
# - 合 6 意外出 8 级（连升两级）：`mianban_6` 下预留 bp=0 的结果槽，面板实际概率待校准；
#   前端可传 baoji_bp 覆盖（万分比），按「额外产出」计入期望收益。
# ============================================================================

