name: CI

on:
  push:
    branches: [dev, beta, release]
  pull_request:
    branches: [dev, beta, release]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 构建 + 测试 + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace

  golden:
    name: 金标准回归（计算数值）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 金标准测试（core golden）
        run: cargo test -p jxcg_core --test golden

  frontend:
    name: 前端构建 (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/jxcg_app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: 安装依赖（bun）
        run: bun install --frozen-lockfile
      - name: 构建
        run: bun run build
      - name: 测试
        run: bun run test
